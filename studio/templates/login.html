<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrontierPilot 2.0 • Executive Gatekeeper</title>
  <link rel="stylesheet" href="/assets/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/bootstrap-icons.min.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%2232%22 height=%2232%22><text y=%2226%22 font-size=%2224%22>⚡</text></svg>">
  <style>
    :root {
      --bg: #07090e;
      --card: rgba(15, 23, 42, 0.78);
      --border: rgba(255, 255, 255, 0.09);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --cyan: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Cosmic Framer Ambient Glows */
    .glow-orb-1 {
      position: absolute;
      width: 480px;
      height: 480px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(99, 102, 241, 0) 70%);
      top: -120px;
      left: -100px;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
    }
    .glow-orb-2 {
      position: absolute;
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.18) 0%, rgba(56, 189, 248, 0) 70%);
      bottom: -100px;
      right: -100px;
      border-radius: 50%;
      filter: blur(60px);
      pointer-events: none;
    }
    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 20px;
    }
    .glass-card {
      background: var(--card);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.35);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 24px -4px rgba(99, 102, 241, 0.25);
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1, #38bdf8);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .form-control-framer {
      background: rgba(2, 6, 23, 0.65);
      border: 1px solid var(--border);
      color: #ffffff;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 15px;
      transition: all 0.2s ease;
      width: 100%;
    }
    .form-control-framer:focus {
      background: rgba(2, 6, 23, 0.85);
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
      color: #ffffff;
      outline: none;
    }
    .btn-unlock {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      font-weight: 700;
      font-size: 14.5px;
      border-radius: 10px;
      padding: 12px 18px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
    }
    .btn-unlock:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.45);
    }
    .btn-unlock:active {
      transform: translateY(0);
    }
    .btn-slack-req {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: #cbd5e1;
      font-weight: 600;
      font-size: 13.5px;
      border-radius: 10px;
      padding: 10px 16px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-slack-req:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.18);
    }
    .divider-line {
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 20px 0;
    }
    .divider-line::before, .divider-line::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--border);
    }
    .divider-line::before { margin-right: 12px; }
    .divider-line::after { margin-left: 12px; }
  </style>
</head>
<body>
  <div class="glow-orb-1"></div>
  <div class="glow-orb-2"></div>
  <div class="grid-overlay"></div>

  <div class="login-container">
    <div class="glass-card">
      <div class="brand-icon">
        <i class="bi bi-shield-lock"></i>
      </div>
      <div class="brand-badge">
        <i class="bi bi-patch-check-fill text-primary"></i> Private Executive Cockpit
      </div>
      <h3 class="fw-bold mb-1 text-white">FrontierPilot 2.0</h3>
      <p class="small text-secondary mb-4">Dedicated to <strong>Aryan Sharma</strong>. Authentication is required to access high-leverage LinkedIn queues and career radars.</p>

      <div id="loginAlert" class="alert alert-danger py-2 small fw-semibold d-none mb-3" style="background: rgba(220, 38, 38, 0.15); border: 1px solid rgba(220, 38, 38, 0.3); color: #fca5a5;"></div>
      <div id="slackStatusAlert" class="alert alert-info py-2 small fw-semibold d-none mb-3" style="background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.3); color: #7dd3fc;"></div>

      <form id="loginForm" onsubmit="handlePinLogin(event)">
        <div class="mb-3">
          <label class="form-label small text-secondary fw-semibold mb-1">Owner Master PIN</label>
          <input type="password" id="pinInput" class="form-control-framer" placeholder="Enter owner passcode" autofocus required>
        </div>
        <button type="submit" id="unlockBtn" class="btn-unlock">
          <i class="bi bi-key-fill me-1"></i> Unlock Cockpit
        </button>
      </form>

      <div class="divider-line">or mobile sign-in</div>

      <button type="button" class="btn-slack-req" id="slackReqBtn" onclick="requestSlackApproval()">
        <i class="bi bi-slack text-warning"></i> Request 1-Tap Slack Approval
      </button>

      <div class="text-center mt-4 pt-2">
        <span class="text-muted" style="font-size: 11px;">FrontierPilot Engine • Orbitron AI • Aryan Sharma</span>
      </div>
    </div>
  </div>

  <script>
    let pollInterval = null;

    async function handlePinLogin(e) {
      e.preventDefault();
      const pin = document.getElementById('pinInput').value.trim();
      const alertEl = document.getElementById('loginAlert');
      const btn = document.getElementById('unlockBtn');
      alertEl.classList.add('d-none');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Verifying...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: pin })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = data.redirect || '/';
        } else {
          alertEl.textContent = data.error || 'Authentication failed. Please verify your PIN.';
          alertEl.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-key-fill me-1"></i> Unlock Cockpit';
        }
      } catch (err) {
        alertEl.textContent = 'Server error. Could not connect to authentication gateway.';
        alertEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-key-fill me-1"></i> Unlock Cockpit';
      }
    }

    async function requestSlackApproval() {
      const btn = document.getElementById('slackReqBtn');
      const statusEl = document.getElementById('slackStatusAlert');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Sending Slack Alert...';

      try {
        const res = await fetch('/api/auth/request_slack_access', { method: 'POST' });
        const data = await res.json();
        if (res.ok && data.success) {
          statusEl.innerHTML = '<i class="bi bi-phone me-1"></i> 1-Tap card sent to Aryan\'s Slack! Waiting for tap...';
          statusEl.classList.remove('d-none');
          btn.innerHTML = '<i class="bi bi-hourglass-split me-1"></i> Waiting for Mobile Approval...';
          startPollingApproval(data.request_id);
        } else {
          statusEl.textContent = data.error || 'Failed to dispatch Slack request.';
          statusEl.classList.remove('d-none');
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-slack text-warning"></i> Request 1-Tap Slack Approval';
        }
      } catch (err) {
        statusEl.textContent = 'Network error while contacting Slack gateway.';
        statusEl.classList.remove('d-none');
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-slack text-warning"></i> Request 1-Tap Slack Approval';
      }
    }

    function startPollingApproval(reqId) {
      if (pollInterval) clearInterval(pollInterval);
      pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`/api/auth/check_approval/${reqId}`);
          const data = await res.json();
          if (res.ok && data.approved) {
            clearInterval(pollInterval);
            const statusEl = document.getElementById('slackStatusAlert');
            statusEl.className = 'alert alert-success py-2 small fw-semibold mb-3';
            statusEl.innerHTML = '<i class="bi bi-check-circle-fill me-1"></i> Access Approved by Aryan! Entering cockpit...';
            setTimeout(() => {
              window.location.href = data.redirect || '/';
            }, 800);
          }
        } catch (e) {
          console.warn('Polling check error:', e);
        }
      }, 2500);
    }
  </script>
</body>
</html>
