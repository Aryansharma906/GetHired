<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10"/>
      <stop offset="50%" stop-color="#12151c"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Mesh Glow Gradients -->
    <radialGradient id="meshIndigo" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshViolet" cx="80%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="meshEmerald" cx="50%" cy="85%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Glass Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Animated Radar Pulse -->
    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    @keyframes pulse {
      0% { r: 12px; opacity: 0.8; }
      50% { r: 28px; opacity: 0.2; }
      100% { r: 12px; opacity: 0.8; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes sweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif; font-weight: 400; fill: #94a3b8; }
    .text-accent { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, sans-serif; font-weight: 600; fill: #818cf8; }
    .text-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .card-float-1 { animation: floatCard 6s ease-in-out infinite; }
    .card-float-2 { animation: floatCard 7s ease-in-out 1s infinite; }
    .card-float-3 { animation: floatCard 6.5s ease-in-out 2s infinite; }
    .radar-pulse { animation: pulse 3s ease-in-out infinite; }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="520" rx="16" fill="url(#bgGradient)"/>

  <!-- Ambient Mesh Glows -->
  <rect width="1200" height="520" rx="16" fill="url(#meshIndigo)"/>
  <rect width="1200" height="520" rx="16" fill="url(#meshViolet)"/>
  <rect width="1200" height="520" rx="16" fill="url(#meshEmerald)"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.07">
    <path d="M 0,65 L 1200,65 M 0,130 L 1200,130 M 0,195 L 1200,195 M 0,260 L 1200,260 M 0,325 L 1200,325 M 0,390 L 1200,390 M 0,455 L 1200,455" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100,0 L 100,520 M 200,0 L 200,520 M 300,0 L 300,520 M 400,0 L 400,520 M 500,0 L 500,520 M 600,0 L 600,520 M 700,0 L 700,520 M 800,0 L 800,520 M 900,0 L 900,520 M 1000,0 L 1000,520 M 1100,0 L 1100,520" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Top Status Pill -->
  <g transform="translate(60, 48)">
    <rect width="320" height="34" rx="17" fill="#1e2230" stroke="#333b52" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="22" class="text-sub" font-size="12" font-weight="600" fill="#cbd5e1">AI ORCHESTRATION ENGINE • v2.0</text>
  </g>

  <!-- Hero Header Typography -->
  <g transform="translate(60, 140)">
    <text x="0" y="0" class="text-title" font-size="52" letter-spacing="-1.5">
      getHired <tspan fill="url(#meshViolet)">2.0</tspan>
    </text>
    <text x="0" y="42" class="text-title" font-size="28" font-weight="600" fill="#e2e8f0" letter-spacing="-0.5">
      Autonomous Career Radar &amp; Thought-Leadership Hub
    </text>
    <text x="0" y="80" class="text-sub" font-size="16" fill="#94a3b8">
      Designed by Aryan Sharma • Powered by Google Gemini &amp; Multi-Cloud Pipelines
    </text>
  </g>

  <!-- Feature Metric Pills -->
  <g transform="translate(60, 270)">
    <!-- Pill 1: Opportunities -->
    <g>
      <rect width="180" height="42" rx="12" fill="#181d28" stroke="#2a3245" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#38bdf8"/>
      <text x="34" y="26" class="text-sub" font-size="13" font-weight="600" fill="#e2e8f0">15 Active Matches</text>
    </g>
    <!-- Pill 2: Gemini Scoring -->
    <g transform="translate(195, 0)">
      <rect width="175" height="42" rx="12" fill="#181d28" stroke="#2a3245" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#a855f7"/>
      <text x="34" y="26" class="text-sub" font-size="13" font-weight="600" fill="#e2e8f0">Gemini 2.5 Flash</text>
    </g>
    <!-- Pill 3: Slack Actions -->
    <g transform="translate(385, 0)">
      <rect width="165" height="42" rx="12" fill="#181d28" stroke="#2a3245" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#10b981"/>
      <text x="34" y="26" class="text-sub" font-size="13" font-weight="600" fill="#e2e8f0">1-Tap Slack Hub</text>
    </g>
    <!-- Pill 4: Zero-Leak Guard -->
    <g transform="translate(565, 0)">
      <rect width="180" height="42" rx="12" fill="#181d28" stroke="#2a3245" stroke-width="1"/>
      <circle cx="20" cy="21" r="4" fill="#f59e0b"/>
      <text x="34" y="26" class="text-sub" font-size="13" font-weight="600" fill="#e2e8f0">Zero-Leak Guard</text>
    </g>
  </g>

  <!-- Interactive Terminal Snippet Preview -->
  <g transform="translate(60, 345)">
    <rect width="685" height="115" rx="14" fill="#0c1017" stroke="#212638" stroke-width="1"/>
    <!-- Terminal Header Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="75" y="22" class="text-mono" font-size="11" fill="#64748b">bash - terminal</text>
    <!-- Terminal Lines -->
    <text x="20" y="55" class="text-mono" font-size="13" fill="#818cf8">$ git clone https://github.com/Aryansharma906/GetHired.git</text>
    <text x="20" y="80" class="text-mono" font-size="13" fill="#38bdf8">$ ./scripts/start_studio.sh</text>
    <text x="20" y="102" class="text-mono" font-size="12" fill="#10b981">● getHired 2.0 active at http://127.0.0.1:5050 (Warm Ivory UI • Zero Leaks)</text>
  </g>

  <!-- RIGHT SIDE: Framer-Style Floating Interactive Glass Cards -->
  
  <!-- Floating Card 1: Match Score Radar -->
  <g class="card-float-1" transform="translate(800, 50)">
    <rect width="340" height="180" rx="16" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <circle cx="40" cy="40" r="18" fill="#4338ca" opacity="0.3"/>
    <text x="33" y="46" class="text-title" font-size="16" fill="#818cf8">🎯</text>
    <text x="70" y="36" class="text-title" font-size="15" fill="#ffffff">Sarvam AI • Model Evaluation</text>
    <text x="70" y="54" class="text-sub" font-size="12" fill="#94a3b8">Autonomous Radar Fit</text>

    <!-- Progress Meter -->
    <rect x="25" y="80" width="290" height="8" rx="4" fill="#1e2433"/>
    <rect x="25" y="80" width="278" height="8" rx="4" fill="url(#meshEmerald)"/>
    <rect x="25" y="80" width="278" height="8" rx="4" fill="#10b981">
      <animate attributeName="width" values="0;278" dur="1.8s" fill="freeze"/>
    </rect>

    <text x="25" y="115" class="text-title" font-size="28" fill="#ffffff">96%</text>
    <text x="85" y="112" class="text-sub" font-size="12" fill="#94a3b8">High Conviction Match</text>

    <!-- Badges -->
    <g transform="translate(25, 135)">
      <rect width="85" height="24" rx="6" fill="#1e2433"/>
      <text x="10" y="16" class="text-sub" font-size="11" fill="#cbd5e1">LLM Safety</text>
    </g>
    <g transform="translate(118, 135)">
      <rect width="90" height="24" rx="6" fill="#1e2433"/>
      <text x="10" y="16" class="text-sub" font-size="11" fill="#cbd5e1">Benchmarking</text>
    </g>
    <g transform="translate(216, 135)">
      <rect width="95" height="24" rx="6" fill="#1e2433"/>
      <text x="10" y="16" class="text-sub" font-size="11" fill="#cbd5e1">₹1,00,000/mo</text>
    </g>
  </g>

  <!-- Floating Card 2: Slack Interactive Dispatch -->
  <g class="card-float-2" transform="translate(820, 260)">
    <rect width="320" height="200" rx="16" fill="url(#glassCard)" stroke="url(#glassBorder)" stroke-width="1.5"/>
    <circle cx="36" cy="36" r="16" fill="#10b981" opacity="0.2"/>
    <text x="30" y="42" class="text-title" font-size="14" fill="#34d399">💬</text>
    <text x="65" y="34" class="text-title" font-size="14" fill="#ffffff">Slack Career Approval Hub</text>
    <text x="65" y="50" class="text-sub" font-size="11" fill="#94a3b8">Instant 1-Tap Mobile Review</text>

    <rect x="20" y="70" width="280" height="52" rx="10" fill="#0d1117" stroke="#212638" stroke-width="1"/>
    <text x="32" y="92" class="text-sub" font-size="12" fill="#e2e8f0">🚀 1-Tap Apply Pitch Ready</text>
    <text x="32" y="108" class="text-sub" font-size="11" fill="#64748b">ATS Resume Tailored for Aryan</text>

    <!-- Slack Buttons Mockup -->
    <g transform="translate(20, 136)">
      <rect width="132" height="36" rx="8" fill="#10b981"/>
      <text x="24" y="23" class="text-title" font-size="12" fill="#ffffff">Approve &amp; Send</text>
    </g>
    <g transform="translate(162, 136)">
      <rect width="138" height="36" rx="8" fill="#262c3d" stroke="#3b4257" stroke-width="1"/>
      <text x="34" y="23" class="text-sub" font-size="12" fill="#cbd5e1">View Pitch</text>
    </g>
  </g>

</svg>
