name: LinkedIn Daily Cloud Auto-Pilot

on:
  schedule:
    # 9:00 AM IST is 03:30 AM UTC (runs Monday through Friday)
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  dispatch_daily_post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Post with Gemini & Send to Slack
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          PUBLORA_API_KEY: ${{ secrets.PUBLORA_API_KEY }}
          LINKEDIN_PLATFORM_ID: ${{ secrets.LINKEDIN_PLATFORM_ID }}
        run: |
          python3 scripts/run_slack_pipeline.py --auto-generate
